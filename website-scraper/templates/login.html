<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · ScrapeFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fafc);display:grid;place-items:center}.card{width:min(420px,92vw);border:0;border-radius:22px;box-shadow:0 24px 70px rgba(15,23,42,.14)}.logo{width:54px;height:54px;border-radius:16px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px}</style></head><body><div class="card p-4 p-md-5"><div class="logo mb-4">S</div><h2>ScrapeFlow Login</h2><p class="text-muted">Sign in to manage scraping jobs and exports.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label">Username</label><input name="username" class="form-control mb-3" required autofocus><label class="form-label">Password</label><input name="password" type="password" class="form-control mb-4" required><button class="btn btn-primary w-100">Sign in</button></form><small class="text-muted d-block mt-3">Change default credentials in the .env file before deployment.</small></div></body></html>
